<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypermedia — MAM</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f0f0f0;
      --accent: #00ffcc;
      --card-bg: #1a1a1a;
      --border: rgba(255,255,255,.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', sans-serif; overflow: hidden; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
    }
    header span {
      font-size: .75rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      padding: 2rem 2.5rem;
      overflow-y: auto;
      height: calc(100vh - 72px);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card__thumb {
      width: 100%;
      aspect-ratio: 4/3;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255,255,255,.15);
    }
    .card__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card__info {
      padding: .875rem 1rem;
    }
    .card__title {
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: .25rem;
    }
    .card__meta {
      font-size: .75rem;
      color: rgba(255,255,255,.45);
    }

    /* PLAYER OVERLAY */
    #player {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      z-index: 100;
      flex-direction: column;
    }
    #player.is-open { display: flex; }
    #player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #player-title { font-size: .9rem; font-weight: 700; }
    #player-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: .4rem 1.1rem;
      cursor: pointer;
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: border-color .15s;
    }
    #player-close:hover { border-color: var(--accent); color: var(--accent); }
    #player-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #player-stage ruffle-player,
    #player-stage iframe,
    #player-stage video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>Hypermedia</h1>
  <span>Museum of Art and Media — Roma</span>
</header>

<div class="grid" id="grid"></div>

<div id="player">
  <div id="player-bar">
    <span id="player-title"></span>
    <button id="player-close">✕ Chiudi</button>
  </div>
  <div id="player-stage" id="stage"></div>
</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  // Catalog — add items here as you copy content
  const catalog = [
    // { title: "Titolo opera", author: "Artista", year: 1999, file: "content/opera.swf", type: "swf", thumb: "" },
  ]

  const grid = document.getElementById('grid')
  const player = document.getElementById('player')
  const playerTitle = document.getElementById('player-title')
  const playerClose = document.getElementById('player-close')
  const stage = document.getElementById('player-stage')

  function renderGrid() {
    if (!catalog.length) {
      grid.innerHTML = '<p style="color:rgba(255,255,255,.3);padding:2rem;grid-column:1/-1">Nessun contenuto ancora aggiunto.</p>'
      return
    }
    catalog.forEach((item, i) => {
      const card = document.createElement('div')
      card.className = 'card'
      card.innerHTML = `
        <div class="card__thumb">
          ${item.thumb ? `<img src="${item.thumb}" alt="${item.title}">` : '⬡'}
        </div>
        <div class="card__info">
          <div class="card__title">${item.title}</div>
          <div class="card__meta">${item.author || ''}${item.year ? ' — ' + item.year : ''}</div>
        </div>`
      card.addEventListener('click', () => openItem(item))
      grid.appendChild(card)
    })
  }

  function openItem(item) {
    playerTitle.textContent = `${item.title}${item.author ? ' — ' + item.author : ''}`
    stage.innerHTML = ''

    if (item.type === 'swf') {
      const rp = document.createElement('ruffle-player')
      rp.src = item.file
      stage.appendChild(rp)
    } else if (item.type === 'video') {
      const v = document.createElement('video')
      v.src = item.file
      v.controls = true
      v.autoplay = true
      stage.appendChild(v)
    } else if (item.type === 'html') {
      const fr = document.createElement('iframe')
      fr.src = item.file
      fr.style.border = 'none'
      stage.appendChild(fr)
    }

    player.classList.add('is-open')
  }

  function closePlayer() {
    player.classList.remove('is-open')
    stage.innerHTML = ''
  }

  playerClose.addEventListener('click', closePlayer)
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer() })

  renderGrid()
</script>
</body>
</html>
